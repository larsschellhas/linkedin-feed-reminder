name: Publish to AMO

# Triggered by pushing a version tag, e.g.:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions),
# generated at https://addons.mozilla.org/en-US/developers/addon/api/key/:
#   AMO_JWT_ISSUER  - the "JWT issuer" value
#   AMO_JWT_SECRET  - the "JWT secret" value

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to attach the signed .xpi to a GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build and sign with AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --channel=listed \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --artifacts-dir=web-ext-artifacts

      - name: Upload signed artifact to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: signed-extension
          path: web-ext-artifacts/*.xpi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/*.xpi
          generate_release_notes: true
